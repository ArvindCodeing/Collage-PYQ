<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - College PYQ Portal</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header">
    <div class="title">Admin Panel</div>
    <a href="index.html" class="menu-btn" style="text-decoration:none; width:auto; padding:0 12px; font-size:14px; font-weight:600;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px; height:16px; margin-right:6px;"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      Back to Home
    </a>
  </header>

  <main class="main-grid">
    <div id="admin-container" style="grid-column: 1 / -1; width: 100%;">
      
      <div id="password-section" class="login-wrap">
        <div class="login-header">
          <div class="login-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          </div>
          <h3>Welcome Back</h3>
          <p class="muted">Please enter your admin credentials to continue</p>
        </div>
        
        <form id="loginForm" class="admin-form login-form" onsubmit="handleAuth(event)">
          <div class="input-group">
            <label for="email">Email Address</label>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="email" class="input" placeholder="admin@example.com" aria-label="Admin email" required>
            </div>
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="password" class="input" placeholder="••••••••" aria-label="Admin password" required minlength="6">
            </div>
          </div>
          <button class="btn primary gradient-btn" type="submit" id="loginBtn">
            <span>Login to Dashboard</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </form>
        <div id="login-help" class="login-feedback muted">Use your admin credentials to manage PYQ data.</div>
      </div>

      <div id="admin-content" style="display:none;" class="panel admin-panel admin-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
          <h3 style="margin:0; font-size: 18px;">Dashboard</h3>
          <button class="btn" onclick="handleLogout()" style="padding: 8px 16px; font-size: 13px; border: 1px solid var(--border-color); background: transparent;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
          </button>
        </div>
        <div class="admin-controls">
          <div class="row" style="display:flex; gap:12px; margin-bottom:16px;">
            <select id="section-select" class="input" style="flex:1;">
              <option value="jut">JUT PYQ</option>
              <option value="chaibasa">Chaibasa Engineering College PYQ</option>
            </select>
            <button class="btn primary" onclick="loadSection()">Load Section</button>
          </div>

          <div class="row" style="display:flex; gap:12px; align-items:center; margin-bottom:24px; flex-wrap:wrap;">
            <button class="btn" onclick="exportData()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px;vertical-align:text-bottom;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
              Export JSON
            </button>
            
            <label class="btn file-wrap" style="display:flex; align-items:center; cursor:pointer;">
              <input type="file" id="importFile" accept="application/json" style="display:none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
              <span id="file-name" class="file-label">Choose JSON</span>
            </label>
            
            <label class="merge-label" style="display:flex; align-items:center; gap:6px; font-size:14px;">
              <input type="checkbox" id="mergeImport" style="width:16px; height:16px; accent-color:var(--primary);"> Merge
            </label>
            <button class="btn primary" onclick="importData()">Import</button>
          </div>
        </div>

        <div id="section-content" class="section-content"></div>
      </div>
    </div>
  </main>

  <!-- Custom Modal Dialog -->
  <div id="adminModal" class="modal-overlay">
    <div class="modal-card panel">
      <h3 id="modalTitle" style="margin-top:0; margin-bottom:12px; font-size:18px;">Prompt</h3>
      <p id="modalMessage" style="margin-top:0; margin-bottom:16px; font-size:14px; color:var(--muted);"></p>
      <input type="text" id="modalInput" class="input" style="width:100%; margin-bottom:20px; display:none;">
      <div style="display:flex; justify-content:flex-end; gap:12px;">
        <button id="modalCancel" class="btn">Cancel</button>
        <button id="modalConfirm" class="btn primary">Confirm</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    © 2025 Arvind Mode | All Rights Reserved
  </footer>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyALNiis2UEzQAP_vRmlzI_9ShivO2wEHFA",
      authDomain: "collegepyq-120f7.firebaseapp.com",
      projectId: "collegepyq-120f7",
      storageBucket: "collegepyq-120f7.firebasestorage.app",
      messagingSenderId: "726374864349",
      appId: "1:726374864349:web:3255f152e945e715191234"
    };
    try { firebase.initializeApp(firebaseConfig); } catch (e) { console.warn('Firebase init skipped or duplicate', e); }
  </script>

  <script src="admin.js"></script>
  <script>
    // Update filename display on import
    document.getElementById('importFile').addEventListener('change', function(e) {
      const fileName = e.target.files[0] ? e.target.files[0].name : 'Choose JSON';
      document.getElementById('file-name').textContent = fileName;
    });
  </script>
</body>

</html>
