<body>
  <header class="site-header">

      </a>
      <a class="social linkedin" href="https://in.linkedin.com/in/arvind-kumar-cse" target="_blank"

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"

        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

  <main class="main-grid">
    <!-- Left column: JUT -->
    <section class="panel" id="jut-panel">
      <h2>JUT PYQ</h2>

      <div class="branches" id="jutBranches"></div>
    </section>

    <!-- Middle image / banner -->
    <aside class="middle">
      <div class="banner-card">
        <img id="studyImage" src="https://i.ytimg.com/vi/CoY7KWzkyJA/maxresdefault.jpg" alt="Study Types">
        <div class="banner-overlay"></div>
      </div>
      <div class="middle-note">
        <div class="note-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
            <polyline points="10 17 15 12 10 7" />
            <line x1="15" y1="12" x2="3" y2="12" />
          </svg>
        </div>
        <span>Click branch → year → semester → subject to open Google Drive</span>
      </div>
    </aside>

    <!-- Right column: Chaibasa Engineering College -->
    <section class="panel" id="chaibasa-panel">
      <h2>Chaibasa Engineering College PYQ</h2>

      <div class="branches" id="chaiBranches"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2025 Arvind Mode | All Rights Reserved</p>
  </footer>

  <!-- Right-side drawer and overlay -->
  <div id="drawerOverlay" class="drawer-overlay" onclick="closeDrawer()" aria-hidden="true"></div>
  <nav id="sideDrawer" class="side-drawer" aria-hidden="true">
    <div class="drawer-header">
      <div class="drawer-title">Menu</div>
      <button class="drawer-close" aria-label="Close menu" onclick="closeDrawer()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="drawer-list">
      <a class="drawer-item" href="admin.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg> Admin
      </a>
      <button class="drawer-item" onclick="refreshData(); closeDrawer();">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-10.42l5.67-5.67" />
        </svg> Reload Data
      </button>
      <label class="drawer-item theme-toggle" for="themeToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <span class="label">Dark mode</span>
        <div class="toggle-switch">
          <input id="themeToggle" type="checkbox" onchange="toggleTheme(this.checked)">
          <div class="slider"></div>
        </div>
      </label>
      <button class="drawer-item" onclick="alert('Notes — feature placeholder')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
          <polyline points="10 9 9 9 8 9" />
        </svg> Notes
      </button>
      <button class="drawer-item" onclick="alert('Contact — feature placeholder')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    </div>

        <a class="social instagram" href="https://www.instagram.com/arvindmode?igsh=MThkZm1sNjdzaWphMw=="

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"

            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
          </svg>

        <a class="social linkedin" href="https://in.linkedin.com/in/arvind-kumar-cse" target="_blank"

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"

            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
            <rect width="4" height="12" x="2" y="9" />
            <circle cx="4" cy="4" r="2" />
          </svg>
        </a>
      </div>
    </div>
  </nav>

  <!-- Secure In-Website PDF Viewer Modal -->
  <div id="pdfViewerModal" class="pdf-modal" aria-hidden="true">
    <div class="pdf-modal-backdrop" onclick="closePdfViewer()"></div>
    <div class="pdf-modal-container">
      <!-- Header / Toolbar -->
      <div class="pdf-modal-header">
        <div class="pdf-modal-title-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="pdf-icon">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
          </svg>
          <div class="pdf-modal-title" id="pdfViewerTitle">Document Viewer</div>
          <span class="pdf-protected-badge">🔒 View Only</span>
        </div>

        <!-- Controls -->
        <div class="pdf-modal-toolbar">
          <div class="pdf-nav-controls" id="pdfNavControls">
            <button class="pdf-btn" id="pdfPrevPage" onclick="changePdfPage(-1)" title="Previous Page">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6" />
              </svg>
            </button>
            <span class="pdf-page-indicator">
              <span id="pdfCurrentPage">1</span> / <span id="pdfTotalPages">1</span>
            </span>
            <button class="pdf-btn" id="pdfNextPage" onclick="changePdfPage(1)" title="Next Page">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </button>
          </div>

          <div class="pdf-zoom-controls" id="pdfZoomControls">
            <button class="pdf-btn" onclick="zoomPdf(-0.2)" title="Zoom Out">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                <line x1="8" y1="11" x2="14" y2="11" />
              </svg>
            </button>
            <span id="pdfZoomLevel" class="pdf-zoom-text">100%</span>
            <button class="pdf-btn" onclick="zoomPdf(0.2)" title="Zoom In">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                <line x1="11" y1="8" x2="11" y2="14" />
                <line x1="8" y1="11" x2="14" y2="11" />
              </svg>
            </button>
          </div>

          <button class="pdf-btn pdf-close-btn" onclick="closePdfViewer()" title="Close Viewer (Esc)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Viewer Body -->
      <div class="pdf-modal-body" id="pdfViewerBody">
        <div id="pdfLoadingSpinner" class="pdf-spinner-wrap">
          <div class="pdf-spinner"></div>
          <p>Loading document securely...</p>
        </div>
        <div id="pdfCanvasContainer" class="pdf-canvas-container"></div>
        <iframe id="pdfEmbedFrame" class="pdf-embed-frame" style="display:none;" frameborder="0"></iframe>
      </div>
    </div>
  </div>

  <!-- Toast Notification when user tries to Save / Print -->
  <div id="pdfProtectToast" class="pdf-protect-toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      style="width:16px;height:16px;color:#ef4444;">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
    </svg>
    <span>Downloading & Printing is disabled for this document.</span>
  </div>
